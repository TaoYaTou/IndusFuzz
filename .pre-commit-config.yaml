repos:
  - repo: https://github.com/psf/black
    rev: "24.10.0"
    hooks:
      - id: black
        language_version: python3.12
        args: ["--line-length=120"]
        # Scope: tests/ + tools/ only — project has no pre-existing black
        # history; src/ will be reformatted in a dedicated PR later.
        files: ^(tests|tools)/

  - repo: https://github.com/PyCQA/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8
        args: [
          "--max-line-length=120",
          "--ignore=E501,W503",
          "--select=E9,F63,F7,F82,E231,F401,W292",
          "--count",
          "--show-source",
          "--statistics",
        ]
        exclude: |
          (?x)^(
            .test_pkgs/|
            coverage_html/|
            dist/|
            build/|
            reports/|
            venv/|
            __pycache__/|
            \.pyc$
          )

  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.3"
    hooks:
      - id: bandit
        args: ["-r", "src", "-c", "bandit_config.yml", "-lll"]
        pass_filenames: false
