<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- IndusFuzz Icon - Concept A: Hexagon + Nodes -->
  <!-- Colors: #0D1117 (graphite black) + #00FF88 (electric green) -->

  <!-- Hexagon outline with gap at top-right edge -->
  <!-- Hexagon centered at (512, 512), radius ~320 -->
  <!-- Gap spans a small segment of the top-right side -->
  <path d="
    M 512 192
    L 733.13 320
    "
    fill="none" stroke="#0D1117" stroke-width="6" stroke-linecap="square"/>
  <path d="
    M 760 336
    L 789.25 386.56
    L 789.25 637.44
    L 512 832
    L 234.75 637.44
    L 234.75 386.56
    L 486.87 208
    "
    fill="none" stroke="#0D1117" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Gap accent (electric green segments at break point) -->
  <line x1="733.13" y1="320" x2="760" y2="336" stroke="#00FF88" stroke-width="6" stroke-linecap="square"/>

  <!-- 3 internal nodes connected by lines (fuzz test probes) -->
  <!-- Node 1: upper-left -->
  <circle cx="412" cy="412" r="28" fill="#00FF88"/>
  <!-- Node 2: upper-right -->
  <circle cx="612" cy="412" r="28" fill="#00FF88"/>
  <!-- Node 3: bottom-center -->
  <circle cx="512" cy="640" r="28" fill="#00FF88"/>

  <!-- Connecting lines between nodes -->
  <line x1="412" y1="412" x2="612" y2="412" stroke="#00FF88" stroke-width="4" stroke-linecap="round"/>
  <line x1="612" y1="412" x2="512" y2="640" stroke="#00FF88" stroke-width="4" stroke-linecap="round"/>
  <line x1="512" y1="640" x2="412" y2="412" stroke="#00FF88" stroke-width="4" stroke-linecap="round"/>
</svg>
