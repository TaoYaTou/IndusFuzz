name: Build & Release EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest pytest-cov pytest-timeout bandit flake8 black

      - name: Check formatting with black
        run: |
          black --check --line-length=120 tests/ tools/
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run tests before release
        run: |
          pytest tests/ --timeout=60 -q
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Lint check before release
        run: |
          flake8 src/ tests/ tools/ --max-line-length=120 --ignore=E501,W503 --select=E9,F63,F7,F82,E231,F401,W292 --count
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build EXE with PyInstaller
        run: |
          python -m PyInstaller IndusFuzz.spec --clean --noconfirm

      - name: Prepare portable ZIP structure
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $staging = "IndusFuzz-Desktop-$version-win64"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "dist\IndusFuzz.exe" "$staging\IndusFuzz.exe" -Force
          if (Test-Path "config") { Copy-Item "config" "$staging\config" -Recurse -Force }
          $zipName = "IndusFuzz-Desktop-$version-win64.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipName -Force
          Write-Output "ZIP created: $zipName"
          Get-Item $zipName | Select-Object Name, Length, LastWriteTime

      - name: Determine prerelease flag
        id: prerelease
        run: |
          $tag = $env:GITHUB_REF_NAME
          $is_pre = $tag -match '-(alpha|beta|rc|preview)'
          Write-Output "prerelease=$is_pre" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IndusFuzz-${{ github.ref_name }}
          path: |
            dist/IndusFuzz.exe
            IndusFuzz-Desktop-*-win64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IndusFuzz ${{ github.ref_name }}"
          files: |
            dist/IndusFuzz.exe
            IndusFuzz-Desktop-*-win64.zip
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: true
