[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=src --cov-report=term-missing --cov-report=html:coverage_html
pythonpath = .
markers =
    slow: marks tests as slow
    network: marks tests that require network access
    real_hw: marks tests that require real hardware