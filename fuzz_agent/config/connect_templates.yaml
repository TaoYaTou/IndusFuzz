# IndusFuzz 真实设备连接参数模板
# 对应 src/core/menu.py 中 PROTOCOL_CONNECT_PARAMS，供真实设备测试场景参考
# 每个协议包含默认端口和额外连接参数

modbus:
  default_port: 502
  extra:
    - key: unit_id
      label: "Unit ID"
      default: 1
      type: int
      min: 1
      max: 255
      hint: "1-255，部分设备用 255"

s7comm:
  default_port: 102
  extra:
    - key: rack
      label: "Rack"
      default: 0
      type: int
      min: 0
      max: 7
      hint: "通常为 0"
    - key: slot
      label: "Slot"
      default: 1
      type: int
      min: 1
      max: 31
      hint: "S7-300/400 常用 2 或 3，S7-1200/1500 用 1"

dnp3:
  default_port: 20000
  extra:
    - key: master_addr
      label: "Master Address"
      default: 1
      type: int
      min: 0
      max: 65519
      hint: "主站地址"
    - key: outstation_addr
      label: "Outstation Address"
      default: 10
      type: int
      min: 0
      max: 65519
      hint: "从站地址"

iec104:
  default_port: 2404
  extra:
    - key: common_addr
      label: "Common Address"
      default: 1
      type: int
      min: 0
      max: 65535
      hint: "公共地址，需与设备一致"

iec61850:
  default_port: 102
  extra:
    - key: ied_ref
      label: "IED 引用"
      default: ""
      type: str
      hint: "可选，留空自动发现"

enip:
  default_port: 44818
  extra:
    - key: slot
      label: "CPU 槽号"
      default: 0
      type: int
      min: 0
      max: 255
      hint: "默认 0"

opcua:
  default_port: 4840
  use_endpoint: true
  extra:
    - key: security_policy
      label: "安全策略"
      default: "None"
      type: str
      hint: "None / Basic128Rsa15 / Basic256"
